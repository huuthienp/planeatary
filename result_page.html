<body>

<div class="main-container">
    <div class="spinner hidden" id="spinner"></div>
    <div class="Header">
        <!-- Sidebar -->
        <nav class="navbar navbar-dark navbar-expand-lg sticky-top" style="background-color: #02897A;">

                        <h5 class="offcanvas-title d-flex align-items-center text-white" id="offcanvasNavbarLabel"><img  src="./images/transparent_logo.png" width="40" height="auto" class="d-inline-block align-text-top"/>planeatary</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body" style="background-color: #02897A;">
                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item">

                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-lg-end" style="background-color: #25b3a2;">

                            <li class="nav-item">

        </div>
        <div class="m-content">
            <div class="pre-postQ">
                <button id="preQ">PreQuiz</button>
                <button id="postQ">PostQuiz</button>
                <button id="com-tasks">Task</button>
            </div>
            <div class="result">
                <div class="congrats">
                    <h1 id="q-type"></h1>
                    <p id="date-completion-q"></p>
                </div>
                <div class="score">
                    <div class="circle">
                        <h2 id="curr_score"></h2>
                        <p id="total"></p>
                    </div>
                    <p id="improvement"></p>
                    <p class="next-step">Next step: Select 10 Tasks To Improve Your Scores!</p>
                    <p class="suggestion">We suggest focusing on the questions where you scored the lowest on the Quiz!</p>
                </div>
                <button class="select-tasks">Select Tasks →</button>
            </div>

                <div class="questions"></div>
            </div>

        <section class="overlay hidden" id="modalOverlay">
            <div class="align">
                <div class="modal hidden" id="taskModal"> 
                    <div class="btn">
                        <button class="close">x</button>
                    </div>
                    <div class="modal-content">
                        <h2 id="modalTitle" style="padding: 0 20px;"></h2>
                        <p id="modalDescription" style="padding: 0 20px;"></p>
                    </div>
                </div>
            </div>
        </section>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { fetchTaskStatus } from './data-functions.mjs';

        const Qbuttoncontainer = document.querySelector(".pre-postQ");
        const Pre_Q = document.querySelector("#preQ");
        const Post_Q = document.querySelector("#postQ");
        const selectButton = document.querySelector(".select-tasks");
        const cardContainer = document.querySelector(".questions");
        const tmodal = document.getElementById("taskModal");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const modalDescription = document.getElementById("modalDescription");
        const header = document.getElementById("q-type");
        const completion_date = document.getElementById("date-completion-q");
    
        let scores = [];
        let spinnerStartTime;
        let isLoading;
        let preResponseId = localStorage.getItem('preResponseId'); //This has to be change to user's identify
        const closeButt = document.querySelector('.close');


        const comparison = document.getElementById('improvement');
        const select =  document.querySelector('.select-tasks');
        
        // Function to show the modal
        function showModal(title, description) {
            closeButt.classList.remove('hidden');
            modalTitle.textContent = title;
            modalDescription.innerHTML = description;
            tmodal.classList.remove("hidden");
            tmodal.style.backgroundColor = 'white';
            modalOverlay.classList.remove("hidden");
        }

        // Function to close the modal
        function closeModal() {
            closeButt.classList.remove('hidden');
            tmodal.classList.add("hidden");
            modalOverlay.classList.add("hidden");
        }

        // Close modal when user clicks the close button
        document.querySelector(".close").addEventListener("click", closeModal);

        // Close modal when user clicks outside the modal
        window.addEventListener("click", function(event) {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });
                
        document.addEventListener("DOMContentLoaded", async function() {
            document.getElementById('postQ').style.color = 'white';
            document.getElementById('preQ').style.color = 'white';
            document.getElementById('com-tasks').style.color = 'white';
            const spinner = document.getElementById('spinner');
            const ch = document.getElementById('ch');

            let isLoading = false;
            const minDisplayTime = 2000; 
            let spinnerStartTime;
            let preResult = JSON.parse(localStorage.getItem('preResult'));
            let postResult = JSON.parse(localStorage.getItem('postResult'));
            let pre_rec = localStorage.getItem('preRecordedDate');
            let post_rec = localStorage.getItem('postRecordedDate');
            let task_rec = [];
            let tasks = JSON.parse(localStorage.getItem('tasks'));
            //need BE confirmation
            let detailed = JSON.parse(localStorage.getItem('com_tasks'));

            // Function to show the spinner
            function showSpinner() {
                console.log("Showing spinner...");
                spinner.classList.remove('hidden');
                modalOverlay.classList.remove('hidden');
                closeButt.classList.add('hidden');
                isLoading = true;
                spinnerStartTime = Date.now();
            };
            
            // Function to hide the spinner
            function hideSpinner() {
                const elapsedTime = Date.now() - spinnerStartTime;
                if (elapsedTime < minDisplayTime) {
                    // Delay hiding spinner until the minimum display time
                    setTimeout(() => {
                        console.log("Hiding spinner after min time...");
                        spinner.classList.add('hidden');
                        modalOverlay.classList.add('hidden');
                        isLoading = false;
                    }, minDisplayTime - elapsedTime);
                } else {
                    //console.log("Hiding spinner...");
                    spinner.classList.add('hidden');
                    modalOverlay.classList.add('hidden');
                    closeButt.classList.remove('hidden');
                    isLoading = false;
                }
            }

            // Retrieve tasks from localStorage or fetch if not available
            async function fetchTasks() {
                const taskData = localStorage.getItem('tasks');
                if (!taskData) {
                    try {
                        showSpinner();
                        const response = await fetch('updated_tasks_final.json');
                        if (!response.ok) {
                            throw new Error('Network response was not ok ' + response.statusText);
                        }
                        const data = await response.json();
                        hideSpinner();
                        return data;
                    } catch (error) {
                        console.error('Fetch error:', error);
                        alert('Failed to load tasks. Please try again later.');
                        return null;
                    };
                    
                }
                return JSON.parse(taskData);
            }

            // Function to get task status from the API
            async function fetchTaskStatus_() {  // archive
                try {
                    showSpinner();
                    const response = await fetch('/api/manage-tasks', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Q-RESPONSE-ID': preResponseId, //Need change 
                        }

                    });
                    
                    const data = await response.json();
                    console.log('Task status fetched:', data);
                    hideSpinner();
                    return data;
                } catch (error) {
                    hideSpinner();
                    console.error('Error fetching task status:', error);
                    return null;
                }
            }
               

            function compareScores() {
                let preQuizTotal = preResult.totalScore;
                if (postResult) {
                    let postQuizTotal = postResult.totalScore;
                    comparison.textContent = `Your score improved by ${postQuizTotal - preQuizTotal}`;
                }
                else {
                    return 0;
                }
            }

            function displayQuestions(questionsData) {
                cardContainer.innerHTML = ''; 
                comparison.innerHTML = ''; 
                header.innerHTML='';
                completion_date.innerHTML='';

                //console.log('Pre Result:', preResult);
                //console.log('Post Result:', postResult);

                if (!questionsData.pointArray || !Array.isArray(questionsData.pointArray)) {
                    document.getElementById('curr_score').textContent = 'No score available.';
                    cardContainer.innerHTML = 'Sorry, there is something wrong in the system. Please allow us to fix it.';
                    return;
                }
                
                if (postResult) {
                    let date = new Date(post_rec);
                    header.innerHTML = 'POST-QUIZ RESULT';
                    let localHours = String(date.getHours()).padStart(2, "0");
                    let localMinutes = String(date.getMinutes()).padStart(2, "0");
                    let year = date.getFullYear();
                    let month = String(date.getMonth() + 1).padStart(2, '0'); 
                    let day = String(date.getDate()).padStart(2, '0');
                     
                    document.getElementById('curr_score').textContent = questionsData.totalScore;
                    document.getElementById('total').textContent = 60;
                    completion_date.innerHTML = `Post quiz was completed at ${localHours}:${localMinutes} on ${day}/${month}/${year}`
                
                } else if (preResult) {
                    let date = new Date(pre_rec);
                    header.innerHTML = 'PRE-QUIZ RESULT';
                    let localHours = String(date.getHours()).padStart(2, "0");
                    let localMinutes = String(date.getMinutes()).padStart(2, "0");
                    let year = date.getFullYear();
                    let month = String(date.getMonth() + 1).padStart(2, '0'); 
                    let day = String(date.getDate()).padStart(2, '0');

                    document.getElementById('curr_score').textContent = questionsData.totalScore;
                    document.getElementById('total').textContent = 60;
                    completion_date.innerHTML = `Pre quiz was completed at ${localHours}:${localMinutes} on ${day}/${month}/${year}`
                } 
                
                // Iterate over each question in the pointArray
                questionsData.pointArray.forEach((score, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.classList.add('question');

                    // Apply styling based on score
                    if (score <= 2) {
                        questionDiv.classList.add('red');
                    } else if (score >= 3) {
                        questionDiv.classList.add('green');
                    }

                    // Create and append question title
                    const questionTitle = document.createElement('h3');
                    questionTitle.textContent = `Question ${index + 1} - ${score} points`;
                    questionDiv.appendChild(questionTitle);

                    cardContainer.appendChild(questionDiv);
                });
                compareScores();

            }


            // Function to display completed tasks 
            async function displaySelectedTasks(tasks) {
                cardContainer.innerHTML = ''; 

                if (!detailed) {
                    cardContainer.innerHTML = 'Sorry, there is something wrong in the system. Please allow us to fix it.';
                    return;
                }

                Object.keys(tasks).forEach(questionKey => {
                    header.innerHTML = '<img src="./images/battery.png"/>'+'All tasks you have completed';
                    const taskGroup = tasks[questionKey].tasks;

                    // Filter tasks that are selected
                    taskGroup.forEach(task => {
                        if (detailed.done.includes(String(task.taskNumber))) {
                            // Create and append a card for each completed task
                            const taskCard = document.createElement("div");
                            taskCard.classList.add(task.status === "Completed" ? "card_completed" : "hidden");

                            const taskName = document.createElement("span");
                            taskName.textContent = task.taskName;

                            // Add an info icon for task description
                            const infoIcon = document.createElement("span");
                            infoIcon.classList.add("info-icon");
                            infoIcon.innerHTML = "&#9432;"; 

                            // Set the click event for the info icon to show the modal
                            infoIcon.addEventListener('click', function(event) {
                                event.stopPropagation(); 
                                showModal(task.taskName, task.taskDescription);
                            });

                            const completion = document.createElement("span");
                            completion.classList.add("completion");
                            completion.textContent = task.status === "Completed" ? "Completed" : null;

                            taskCard.appendChild(taskName);
                            taskCard.appendChild(infoIcon); 
                            taskCard.appendChild(completion);
                            cardContainer.appendChild(taskCard);
        
                            }
                            
                        });
                    });
                    
                    const latestTimestamp = Math.max(...task_rec);
                    let date = new Date(latestTimestamp);
                    let day = String(date.getDate()).padStart(2, '0');      
                    let month = String(date.getMonth() + 1).padStart(2, '0'); 
                    let year = date.getFullYear();                       
                    let hours = String(date.getHours()).padStart(2, '0');  
                    let minutes = String(date.getMinutes()).padStart(2, '0'); 
                    
                    completion_date.innerHTML = `Last task was completed at ${hours}:${minutes} on ${day}/${month}/${year}`;
            }

        if (postResult) {
            displayQuestions(postResult);
            document.getElementById('postQ').style.backgroundColor = '#02897A';
            document.getElementById('preQ').style.backgroundColor = '#a9d1cd';
            document.getElementById('com-tasks').style.backgroundColor = '#a9d1cd';
            
            // Remove next step, suggestion, and select-tasks button if post quiz is done
            const toRemove = [
            'p.next-step',
            'p.suggestion',
            'button.select-tasks'
            ];
            
            const tagsToRemove = toRemove.map(s => document.querySelector(s));
            
            tagsToRemove.forEach(
            (tag) => { tag.remove() }
            );
            
            // const challenge_tab = [ch, CH];
            // challenge_tab.forEach(
            // (tab) => {
            //     tab.style.color = '#a9d1cd';
            //     tab.style.cursor = "not-allowed";
            //     tab.disabled = true;
            // }
            //);
            
        } else if (preResult) {
            displayQuestions(preResult);
            // Attach single click listener for the start button navigation
            selectButton.addEventListener('click', function(event) {
                if(postResult) {
                    window.location.href = "index.html";
                } else {
                    window.location.href = "manifesto.html";
                }
                
            });

            ch.style.cursor = "pointer"; 
            ch.disabled = false; 
            ch.addEventListener("click", function() {
                window.location.href = "manifesto.html";  
            });

            document.getElementById('preQ').style.backgroundColor = '#02897A';   
            document.getElementById('postQ').style.backgroundColor = '#a9d1cd';
            document.getElementById('com-tasks').style.backgroundColor = '#a9d1cd';
            document.getElementById('postQ').disabled = true; 
            //displayQuestions(preResult);
        };
            
            document.getElementById('preQ').addEventListener('click', function() {
                if (preResult) {
                    const circle = document.querySelector(".circle");
                    circle.classList.remove('hidden');
                     // Show next step, suggestion, and select-tasks button if display tasks
                     const toshow = [
                    'p.next-step',
                    'p.suggestion',
                    'button.select-tasks'
                    ];
                    
                    const tagsToShow = toshow.map(s => document.querySelector(s));
                    
                    tagsToShow.forEach(
                    (tag) => { tag.classList.remove('hidden'); }
                    );
                    displayQuestions(preResult);
                    document.getElementById('postQ').style.backgroundColor = '#a9d1cd';
                    document.getElementById('postQ').style.transition = "all 1s";
                    document.getElementById('com-tasks').style.backgroundColor = '#a9d1cd';    
                    document.getElementById('com-tasks').style.transition = "all 1s";
                    document.getElementById('preQ').style.backgroundColor = '#02897A';    
                    document.getElementById('preQ').style.transition = "all 1s";
                }
            });
            
            document.getElementById('postQ').addEventListener('click', function() {
                
                if (postResult) {
                    const circle = document.querySelector(".circle");
                    circle.classList.remove('hidden');
                    displayQuestions(postResult);
                    document.getElementById('preQ').style.backgroundColor = '#a9d1cd';
                    document.getElementById('preQ').style.transition = "all 1s";
                    document.getElementById('com-tasks').style.backgroundColor = '#a9d1cd';    
                    document.getElementById('com-tasks').style.transition = "all 1s";
                    document.getElementById('postQ').style.backgroundColor = '#02897A';    
                    document.getElementById('postQ').style.transition = "all 1s";
                }
            });
            
            document.getElementById('com-tasks').addEventListener('click', async function() {
                
                if (!tasks) {
                    tasks = await fetchTasks(); 
                    localStorage.setItem('tasks', JSON.stringify(tasks));
                    tasks = JSON.parse(localStorage.getItem('tasks')); 
                }
                
                if (!detailed) {
                    showSpinner();
                    let com_tasks = await fetchTaskStatus(preResponseId); 
                    hideSpinner();
                    localStorage.setItem('com_tasks', JSON.stringify(com_tasks));
                    detailed = JSON.parse(localStorage.getItem('com_tasks')); 
                    task_rec = detailed.time;
                }
                
                // fetch up-to-date info
                if (!detailed.done) {
                    showSpinner();
                    let done_tasks = await fetchTaskStatus(preResponseId);
                    hideSpinner();
                    localStorage.setItem('com_tasks', JSON.stringify(done_tasks));
                    detailed = JSON.parse(localStorage.getItem('com_tasks'));
                    task_rec = detailed.time;
                }

                const circle = document.querySelector(".circle");
                circle.classList.add('hidden');
                // Remove next step, suggestion, and select-tasks button if display tasks
                const tohide = [
                'p.next-step',
                'p.suggestion',
                'button.select-tasks'
                ];
                
                const tagsToHide = tohide.map(s => document.querySelector(s));
                
                tagsToHide.forEach(
                (tag) => { tag.classList.add('hidden'); }
                );
                displaySelectedTasks(tasks)
                document.getElementById('preQ').style.backgroundColor = '#a9d1cd';
                document.getElementById('preQ').style.transition = "all 1s";
                document.getElementById('postQ').style.backgroundColor = '#a9d1cd';    
                document.getElementById('postQ').style.transition = "all 1s";
                document.getElementById('com-tasks').style.backgroundColor = '#02897A';    
                document.getElementById('com-tasks').style.transition = "all 1s";
            });
            
        });
        </script>
    </body>
</html>
