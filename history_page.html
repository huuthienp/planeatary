        <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
        <script type="module">
            import { fetchTaskStatus } from './scripts/helpers.mjs';
            
            const ch = document.getElementById('ch');
            
            let scores = [];
            
            const spinner = document.getElementById('spinner');
            let spinnerStartTime;
            let isLoading;
            const minDisplayTime = 2000; 
            const bOverlay = document.getElementById("spinnerOverlay");
            
            const offcanvasNavbar = document.getElementById('offcanvasNavbar');
            const offcanvasLinks = document.querySelectorAll('#offcanvasNavbar .nav-link');
            const offcanvasDropdown = document.querySelectorAll('#offcanvasNavbar .dropdown-item > li');
            
            
            const offcanvasListItems = document.querySelectorAll('#offcanvasNavbar li.nav-item');
            const offcanvasDropdownItems = document.querySelectorAll('#offcanvasNavbar .dropdown-menu > li');

            offcanvasLinks.forEach(li => {
                li.addEventListener('click', event => {
                    const targetHref = li.getAttribute('href');
                    const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                    offcanvas.hide();
                    
                    if (targetHref && targetHref !== "#") {
                        window.location.href = targetHref; 
                    } 
                });
            });
            
            offcanvasDropdown.forEach(li => {
                li.addEventListener('click', event => {
                    const targetHref = li.getAttribute('href');
                    const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                    offcanvas.hide();
                    
                    if (targetHref && targetHref !== "#") {
                        window.location.href = targetHref; 
                    } 
                });
            });
            
            // Function to handle navigation or showing toast
            offcanvasListItems.forEach(li => {
                li.addEventListener('click', event => {
                    const link = li.querySelector('a.nav-link'); 
                    const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                    offcanvas.hide();
                    if (link) {
                        const targetHref = link.getAttribute('href');
                        if (targetHref && targetHref !== '#') {
                            window.location.href = targetHref;
                        }
                    }
                })
                
            });
            
            // Function to handle navigation or showing toast
            offcanvasDropdownItems.forEach(li => {
                li.addEventListener('click', event => {
                    const link = li.querySelector('a.dropdown-item'); 
                    
                    const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                    offcanvas.hide();
                    if (link) {
                        const targetHref = link.getAttribute('href');
                        if (targetHref && targetHref !== '#') {
                            window.location.href = targetHref;
                        }
                    }
                });
            })
            
            async function fetchResponses(userId) {
                try {
                    const response = await fetch('/api/fetch-responses', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Q-RESPONSE-ID': userId,
                        }
                    });
                    const { ok, status } = response;
                    if (!ok) {
                        throw new Error(JSON.stringify({
                            status: status,  
                            response: await response.text(),
                        }));
                    }
                    const data = await response.json();
                    console.log('Responses fetched!\n', data);
                    localStorage.setItem(`${userId}:allResponses`, JSON.stringify(data));
                    return data
                    
                } catch (error) {
                    console.warn('Caught', error, '\nin fetchResponse');
                    return null;
                }
            }
            
            
            function showSpinner() {
                spinner.classList.remove('hidden');
                bOverlay.classList.remove('hidden');
                isLoading = true;
                spinnerStartTime = Date.now();
            };
            
            function hideSpinner() {
                const elapsedTime = Date.now() - spinnerStartTime;
                if (elapsedTime < minDisplayTime) {
                    setTimeout(() => {
                        spinner.classList.add('hidden');
                        bOverlay.classList.add('hidden');
                        isLoading = false;
                    }, minDisplayTime - elapsedTime);
                } else {
                    spinner.classList.add('hidden');
                    bOverlay.classList.add('hidden');
                    isLoading = false;
                }
            }

            function isTokenExpired(token) {
                if (!token) return true;
                
                const base64Payload = token.split('.')[1]; 
                const decodedPayload = JSON.parse(atob(base64Payload));
                const exp = decodedPayload.exp; 
                
                // Compare current time with expiration time
                const now = Math.floor(Date.now()/1000); 
                return exp < now; // Returns true if token is expired
            }
            
            async function extractHistory(user, userId) {
                
                var allRes = await fetchResponses(userId);
                let allResponses = JSON.parse(localStorage.getItem(`${userId}:allResponses`) || "[]");
                const mockResponseHistory = JSON.parse(localStorage.getItem(`${userId}:ResponseHistory`) || "{}");

                if ( allResponses.length > 0  && mockResponseHistory) {
                    Object.keys(allResponses).forEach((cycleKey) => {
                        const taskCycle = mockResponseHistory?.[cycleKey]?.lastTask;
                        if (mockResponseHistory?.[cycleKey]?.preId == allResponses?.[cycleKey]?.preResponse.responseId) {
                            allResponses?.[cycleKey] ?? {};
                            allResponses[cycleKey].lastTask = taskCycle;
                        } 
                    });  
                } else {
                    allResponses.push(mockResponseHistory);
                }
                
                localStorage.setItem(`${userId}:allResponses`, JSON.stringify(allResponses));
                return allResponses;
            }
            
            
            function displayTable(userId) {

                const history = JSON.parse(localStorage.getItem(`${userId}:allResponses`));  
                const table = document.getElementById('h-table');
                
                if (!history || Object.keys(history).length === 0) {
                    document.querySelector('div.history-table > table').style.display = 'none';
                    document.querySelector('div.history-table > p').classList.remove('hidden');
                    return;
                }
                
                Object.keys(history).forEach((cycleKey) => {
                    const cycle = history?.[cycleKey] ?? {};
                    const cycleRow = document.createElement('tr');
                    const prescore = document.createElement('td');
                    const predate = document.createElement('td');
                    const postscore = document.createElement('td');
                    const postdate = document.createElement('td');
                    const taskcycle = document.createElement('td');
                    const view = document.createElement('td');
                    
                    // lastTask
                    if (cycle.lastTask) {
                        const [taskId, unixSec] = cycle.lastTask.split('@');
                        if (unixSec) {
                            const date = new Date(parseInt(unixSec, 10) * 1000);
                            // format as needed
                            taskcycle.textContent = date.toLocaleString();
                        } else {
                            taskcycle.textContent = 'N/A';
                        }
                    } else {
                        taskcycle.textContent = 'N/A';
                    }
                    
                    // preResponse
                    if (cycle.preResponse) {
                        const isoString = cycle.preResponse.recordedDate;
                        const dateObj = new Date(isoString);
                        prescore.textContent = cycle.preResponse.result.totalScore;
                        predate.textContent = dateObj.toLocaleString();

                    } else {
                        prescore.textContent = 'N/A';
                        predate.textContent = 'N/A';
                    }
                    
                    // postResponse
                    if (cycle.postResponse) {
                        const isoString = cycle.postResponse.recordedDate;
                        const dateObj = new Date(isoString);
                        postscore.textContent = cycle.postResponse.result.totalScore;
                        postdate.textContent = dateObj.toLocaleString();

                    } else {
                        postscore.textContent = 'N/A';
                        postdate.textContent = 'N/A';
                    }
                    
                    // view button
                    view.innerHTML = '<button type="button" class="btn btn-success track-back">View</button>';
                    view.addEventListener('click', () => {
                        // store cycle in session storage
                        sessionStorage.setItem('selectedCycle', JSON.stringify(cycle));
                        window.location.href = "result_page.html";
                    });
                    
                    cycleRow.append(prescore, predate, postscore, postdate, taskcycle, view);
                    table.appendChild(cycleRow);
                });
            }

            function logOut() {
                const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                
                if (netlifyIdentity.gotrue.currentUser() !== null) {
                    let user = netlifyIdentity.gotrue.currentUser();
                    user.logout().then(() => {
                        offcanvas.hide();
                        sessionStorage.removeItem('selectedCycle');
                        console.log('User has been logged out!');
                        window.location.href = "index.html";
                    });
                } else {
                    window.location.href = "index.html";
                    console.log("No user is logged in!");
                }
            }

            
            document.addEventListener("DOMContentLoaded", async () => {
                const user = netlifyIdentity.gotrue.currentUser();
                
                if (user) {
                    user.jwt().then(token => {
                        if (isTokenExpired(token)) {
                            console.log("Token expired. Prompting user to re-login...");
                            netlifyIdentity.logout();
                            window.location.href = "index.html";
                        } else {
                            console.log("Token is valid.");
                        }
                    });
                }
                
                const userId = user.id;
                const metadata = user.user_metadata;
                const responseHistory = metadata.responseHistory;
                

                document.getElementById('logOut').addEventListener('click', () => {
                    if(confirm("Do you really want to sign out?") == true) {
                        showSpinner();
                        logOut();
                        hideSpinner();
                    }
                });

                await extractHistory(user, userId);
                showSpinner();
                displayTable(userId);
                hideSpinner();
                
            });
            
        </script>
