            async function fetchResponses(userId) {
                try {
                    const response = await fetch('/api/fetch-responses', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Q-RESPONSE-ID': userId,
                        }
                    });
                    const { ok, status } = response;
                    if (!ok) {
                        throw new Error(JSON.stringify({
                            status: status,  
                            response: await response.text(),
                        }));
                    }
                    const data = await response.json();
                    console.log('Responses fetched!\n', data);
                    localStorage.setItem(`${userId}:allResponses`, JSON.stringify(data));
                    return data;
                    
                } catch (error) {
                    console.warn('Caught', error, '\nin fetchResponse');
                    return null;
                }
            }
            
            
            function showSpinner() {
                spinner.classList.remove('hidden');
                bOverlay.classList.remove('hidden');
                isLoading = true;
                spinnerStartTime = Date.now();
            };
            
            function hideSpinner() {
                const elapsedTime = Date.now() - spinnerStartTime;
                if (elapsedTime < minDisplayTime) {
                    setTimeout(() => {
                        spinner.classList.add('hidden');
                        bOverlay.classList.add('hidden');
                        isLoading = false;
                    }, minDisplayTime - elapsedTime);
                } else {
                    spinner.classList.add('hidden');
                    bOverlay.classList.add('hidden');
                    isLoading = false;
                }
            }

            function isTokenExpired(token) {
                if (!token) return true;
                
                const base64Payload = token.split('.')[1]; 
                const decodedPayload = JSON.parse(atob(base64Payload));
                const exp = decodedPayload.exp; 
                
                // Compare current time with expiration time
                const now = Math.floor(Date.now()/1000); 
                return exp < now; // Returns true if token is expired
            }


            function detectAndParseTimestamp(ts) {
                const length = String(ts).length;
                
                if (length <= 10) {
                    // 10 digits => seconds
                    return new Date(ts * 1000);
                } else if (length === 13) {
                    // 13 digits => milliseconds
                    return new Date(ts);
                } else {
                    const asMillis = new Date(ts);
                    return asMillis; 
                }
            }
          
            document.getElementById('logOut').addEventListener('click', () => {

            async function extractHistory(user, userId) {
                
                var allRes = await fetchResponses(userId);
                var allResponses = JSON.parse(localStorage.getItem(`${userId}:allResponses`));
                const mockResponse = JSON.parse(localStorage.getItem(`${userId}:ResponseHistory`));
                const mockResponseHistory = mockResponse?.meta_data?.responseHistory ?? [];
                
                var lastTask = "";

                if ( allResponses || mockResponseHistory.length > 0) {
                    console.log("before ", allResponses);
                    let newAllResponses = allResponses.map((cycleKey, i) => {
                        const taskCycle = mockResponseHistory[i]?.lastTask ?? null;
                        const fetched_tasks = JSON.parse(localStorage.getItem(`${cycleKey?.preResponse?.responseId}:fetched_tasks`));
                        if (mockResponseHistory[i]?.preId == cycleKey?.preResponse?.responseId) {
                            cycleKey.preResponse.lastTask = taskCycle;
                            console.log("Here the last task you will add ", taskCycle);
                            if (fetched_tasks) {
                                try {
                                    console.log("Here the fetched tasks you will extract ", fetched_tasks);
                                    const task_rec = Array.isArray(fetched_tasks?.time) ? fetched_tasks.time : Object.values(fetched_tasks?.time ?? []);
                                    const taskDone =  Array.isArray(fetched_tasks?.done) ? fetched_tasks.done : Object.values(fetched_tasks?.done ?? []);
                                    if (task_rec.length > 0 && task_rec.findIndex(el => el == "") == -1) {
                                        const lastTaskTime = Math.max(...task_rec);
                                        const index = task_rec.findIndex(el => el == lastTaskTime);
                                        const taskName = taskDone[index];
                                        lastTask = `${taskName}@${lastTaskTime}`;
                                        cycleKey.preResponse.lastTask = lastTask;
                                        console.log("Here the time you will add from fetched tasks ", lastTask);
                                    }
                                    
                                } catch(err) {
                                    console.warn("Found err: ", err);
                                }
                            }
                        } 
                        return cycleKey;
                    }); 
                    localStorage.setItem(`${userId}:allResponses`, JSON.stringify(newAllResponses)); 
                } 
                let newAllResponses = JSON.parse(localStorage.getItem(`${userId}:allResponses`));
                console.log("After ", newAllResponses);
                return newAllResponses;
            }
            
            
            async function displayTable(user, userId) {

                const history = await extractHistory(user, userId);
                const table = document.getElementById('h-table');
                
                if (!history || history.length === 0) {
                    document.querySelector('div.history-table > table').style.display = 'none';
                    document.querySelector('div.history-table > p').classList.remove('hidden');
                    return;
                }
                console.log("info to be displayed", history);

                history.forEach((cycleKey) => {
                    const cycle = cycleKey ?? {};
                    const cycleRow = document.createElement('tr');
                    const prescore = document.createElement('td');
                    const predate = document.createElement('td');
                    const postscore = document.createElement('td');
                    const postdate = document.createElement('td');
                    const taskcycle = document.createElement('td');
                    const view = document.createElement('td');
                    
                    // lastTask
                    if (cycle?.preResponse?.lastTask) {
                        const lastTask = cycle.preResponse.lastTask ?? "";
                        const [taskId, unixSec] = lastTask.includes("@") ? lastTask.split('@') : ["N/A", "N/A"];
                        let date;
                        if (unixSec) {
                            const length = String(unixSec).length;
                            if (length <= 10) { date = new Date(parseInt(unixSec, 10)*1000) }
                            else {date = new Date(parseInt(unixSec, 10))}
                            // format as needed
                            taskcycle.textContent = date.toLocaleString();
                        } else {
                            taskcycle.textContent = 'N/A';
                        }
                    } else {
                        taskcycle.textContent = 'N/A';
                    }
                    
                    if (cycle?.preResponse) {
                        prescore.textContent = cycle.preResponse?.result?.totalScore ?? 'N/A';
                        predate.textContent = cycle.preResponse?.recordedDate 
                        ? new Date(cycle.preResponse.recordedDate).toLocaleString() 
                        : 'N/A';
                    } else {
                        prescore.textContent = 'N/A';
                        predate.textContent = 'N/A';
                    }
                    

                   if (cycle?.postResponse) {
                        postscore.textContent = cycle.postResponse?.result?.totalScore ?? 'N/A';
                        postdate.textContent = cycle.postResponse?.recordedDate 
                        ? new Date(cycle.postResponse.recordedDate).toLocaleString() 
                        : 'N/A';
                    } else {
                        postscore.textContent = 'N/A';
                        postdate.textContent = 'N/A';
                    }
                    
                    // view button
                    view.innerHTML = '<button type="button" class="btn btn-success track-back">View</button>';
                    view.addEventListener('click', () => {
                        // store cycle in session storage
                        sessionStorage.setItem('selectedCycle', JSON.stringify(cycle));
                        window.location.href = "result_page.html";
                    });
                    
                    cycleRow.append(prescore, predate, postscore, postdate, taskcycle, view);
                    table.appendChild(cycleRow);
                });
            }

            function logOut() {
                const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                
                if (netlifyIdentity.gotrue.currentUser() !== null) {
                    let user = netlifyIdentity.gotrue.currentUser();
                    user.logout().then(() => {
                        offcanvas.hide();
                        sessionStorage.removeItem('selectedCycle');
                        console.log('User has been logged out!');
                        window.location.href = "index.html";
                    });
                } else {
                    window.location.href = "index.html";
                    console.log("No user is logged in!");
                }
            }

            
            document.addEventListener("DOMContentLoaded", async () => {
                showSpinner();
                const user = netlifyIdentity.gotrue.currentUser();
                
                if (user) {
                    user.jwt().then(token => {
                        if (isTokenExpired(token)) {
                            console.log("Token expired. Prompting user to re-login...");
                            netlifyIdentity.logout();
                            window.location.href = "index.html";
                        } else {
                            console.log("Token is valid.");
                        }

                }
                
                const userId = user.id;
                const metadata = user.user_metadata;
                const responseHistory = metadata.responseHistory;

                await displayTable(user, userId);
