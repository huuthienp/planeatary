            // Function to show the modal
            function showModal(title, description) {
                closeButt.classList.remove('hidden2');
                modalTitle.textContent = title;
                modalDescription.innerHTML = description;
                modal.classList.remove("hidden2");
                modal.style.backgroundColor = 'white';

            // Function to close the modal

                closeButt.classList.add('hidden2');
                modal.classList.add("hidden2");
                modalOverlay.classList.add("hidden2");
            }
            
            
            // Close modal when user clicks the close button
            document.querySelector(".close").addEventListener("click", closeModal);
            
            // Close modal when user clicks outside the modal
            window.addEventListener("click", function(event) {
                if (event.target === modalOverlay) {

                }
            });
            
            function showSpinner() {
                //console.log("Showing spinner...");
                spinner.classList.remove('hidden');
                spOver.classList.remove('hidden');
                isLoading = true;
                spinnerStartTime = Date.now();
            }
            
            // Function to hide the spinner
            function hideSpinner() {
                const elapsedTime = Date.now() - spinnerStartTime;
                
                if (elapsedTime < minDisplayTime) {
                    // Delay hiding spinner until the minimum display time
                    setTimeout(() => {
                        spinner.classList.add('hidden');
                        spOver.classList.add('hidden');
                        isLoading = false;
                    }, minDisplayTime - elapsedTime);
                } else {
                    spinner.classList.add('hidden');
                    spOver.classList.add('hidden');
                    isLoading = false;
                }
            }
            
            function isTokenExpired(token) {
                if (!token) return true;
                
                const base64Payload = token.split('.')[1]; 
                const decodedPayload = JSON.parse(atob(base64Payload));
                const exp = decodedPayload.exp; 
                
                // Compare current time with expiration time
                const now = Math.floor(Date.now()/1000); 
                return exp < now; // Returns true if token is expired
            }
            
            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));

        <script type="module">
            import { fetchTaskStatus, extractTaskData, updateTaskStatus, mergeTaskArrays } from './scripts/helpers.mjs';

            //hard-code updating responseHistory (incompleted)
            async function updateResponseHistory(preResponseId, lastTask) {
                const user = netlifyIdentity.gotrue.currentUser();
                if (!user) {
                    console.error("No user is logged in!");
                    return;
                }
                
                const token = await user.jwt();
                if (isTokenExpired(token)) {
                    console.log("Token expired. Prompting user to re-login...");
                    netlifyIdentity.logout();
                    return;
                }

                const userId = user.id;
                
                console.log("Token is valid.");
                let responseHistory = user.user_metadata.responseHistory || [];
                console.log("Current responseHistory:", responseHistory);
                console.log("lastTask:", lastTask, "preResponseId:", preResponseId);
                let index = responseHistory.findIndex(cycle => cycle.preId === preResponseId);
                
                if (index === -1) {
                    // New preResponseId, add it
                    responseHistory.push({ lastTask: lastTask, preId: preResponseId });
                } else if (!responseHistory[index].lastTask) {
                    // Update existing entry with lastTask if it's missing
                    responseHistory[index].lastTask = lastTask;
                } 

                console.log("Updated responseHistory to save:", responseHistory);
                //manually keep in local storage (remove after logging out)
                const mockResponseHistory = {id: userId,
                    meta_data: { responseHistory: responseHistory } };
                try {
                    // Update user metadata
                    const updatedUser = await user.update({
                        data: { responseHistory: responseHistory },
                    });
                    
                    console.log("User metadata successfully updated:", updatedUser.user_metadata);
                    // Wait for 3 seconds
                    await new Promise(resolve => setTimeout(resolve, 3000)); 
                    // Fetch and save the latest user object to localStorage
                    const updatedUserDetails = await netlifyIdentity.gotrue.currentUser();
                    console.log("Fetched updated user:", updatedUserDetails.user_metadata);
                    
                    // Verify the updated responseHistory
                    if (updatedUserDetails.user_metadata.responseHistory) {
                        localStorage.setItem("gotrue.user", JSON.stringify(updatedUserDetails));
                        console.log("Updated user saved to localStorage:", updatedUserDetails);
                    } else {
                        console.warn("Updated responseHistory not found in the user object.");
                    }
                } catch (error) {
                    console.error("Error updating user metadata:", error);
                } finally {
                    localStorage.setItem(`${userId}:ResponseHistory`, JSON.stringify(mockResponseHistory));
                }
            }
                
            //Function to update the Next button's state
            async function updateNextButton(preResponseId, userId, tasks, Tstatus) {
                let allCompleted = true;
                
                Object.keys(tasks).forEach(questionKey => {
                    const taskGroup = tasks?.[questionKey]?.tasks ?? [];
                    taskGroup.forEach(task => {
                        if (task.choice === "chosen" && task.status !== "Completed") {
                            allCompleted = false; // If any selected task is not "Completed", set false
                        } 
                    });
                });
                
                // Enable or disable the next button based on task completion status
                if (allCompleted) {
                    btn_next.style.pointerEvents = "auto"; // Enable the next button
                    btn_next.style.backgroundColor = "#02897A"; // Update button color when enabled
                    btn_next.style.cursor = "pointer";
                    btn_next.disabled = false;
                } else {
                    btn_next.style.pointerEvents = "none"; // Disable the next button
                    btn_next.style.backgroundColor = "grey"; // Keep it grey if not all tasks are completed
                    btn_next.style.cursor = "not-allowed";
                    btn_next.disabled = true;
                }
            }
            
            // Function to display selected tasks and allow status update
            async function displaySelectedTasks(preResponseId, userId, tasks, Tstatus) {
                const cardContainer = document.querySelector(".card");
                cardContainer.innerHTML = '';  

                //Handle no tasks information from previous page
                if(!tasks) {
                    cardContainer.innerHTML = "<div class='empty-state'>The system is down. Please try again later</div>";
                    return;
                }
 
                await updateTaskStatus(preResponseId, userId, JSON.parse(localStorage.getItem(`${preResponseId}:tasks`)));
                
                Object.keys(tasks).forEach(async (questionKey) => {
                    const taskGroup = tasks?.[questionKey]?.tasks ?? [];
                    // Filter tasks that are selected
                    taskGroup.forEach(task => 
                    {
                        if (task.choice === 'chosen') {
                            // Create and append a card for each selected task
                            const taskCard = document.createElement("div");
                            taskCard.classList.add("task-card", "card_completion");
                            
                            const taskName = document.createElement("span");
                            taskName.textContent = task.taskName + " ";
                            
                            // Add an info icon for task description
                            const infoIcon = document.createElement("span");
                            infoIcon.classList.add("info-icon");
                            infoIcon.innerHTML = "&#9432;"; 
                            
                            // Set the click event for the info icon to show the modal
                            infoIcon.addEventListener('click', function(event) {
                                event.preventDefault();
                                event.stopPropagation(); 
                                showModal(task.taskName, task.taskDescription);
                            });
                            
                            const completion = document.createElement("span");
                            completion.classList.add("completion");
                            completion.textContent = task.status === "Completed" ? "Completed" : "Done";
                            
                            // Set card styles based on status
                            if (task.status === "Completed") {
                                taskCard.style.color = 'black';
                                taskCard.style.backgroundColor = 'rgb(133, 132, 132)';
                                taskName.style.textDecoration = "line-through";
                            } else {
                                taskCard.style.color = 'rgb(71, 71, 71)';
                                taskCard.style.backgroundColor = 'rgb(95, 201, 109)';
                                taskName.style.textDecoration = "none";
                            }
                            
                            // Set task choice and status based on local storage
                            if (Tstatus) {
                                if (Tstatus.chosen.length !== 0) {
                                    if (Tstatus.chosen.includes(String(task.taskNumber))) {
                                        if (Tstatus.done.length !== 0 && Tstatus.done.includes(String(task.taskNumber))) {
                                            taskCard.style.color = 'black';
                                            taskCard.style.backgroundColor = 'rgb(133, 132, 132)';
                                            taskName.style.textDecoration = "line-through";
                                        }
                                    } else if (task.status === "Completed" && Tstatus.chosen.indexOf(String(task.taskNumber)) !== -1) {
                                        let index = Tstatus.chosen.indexOf(String(task.taskNumber));
                                        Tstatus.done[index] = String(task.taskNumber);
                                        Tstatus.time[index] = task.finishTime;
                                        taskCard.style.color = 'black';
                                        taskCard.style.backgroundColor = 'rgb(133, 132, 132)';
                                        taskName.style.textDecoration = "line-through";
                                    }
                                }
                                updateNextButton(preResponseId, userId, tasks, Tstatus);
                            }
                            localStorage.setItem(`${preResponseId}:fetched_tasks`, JSON.stringify(Tstatus));
                            taskCard.appendChild(taskName);
                            taskCard.appendChild(infoIcon); 
                            taskCard.appendChild(completion);
                            cardContainer.appendChild(taskCard);
                            updateNextButton(preResponseId, userId, tasks, Tstatus); 
                            
                            taskCard.addEventListener('click', async (event) => {
                                // Toggle task status between "Done" and "Completed"
                                
                                completion.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Updating...';
                                await delay(500); 

                                task.status = task.status === "Done" ? "Completed" : "Done";
                                
                                if (task.status === "Completed") {
                                    taskCard.style.color = 'black';
                                    taskCard.style.backgroundColor = 'rgb(133, 132, 132)';
                                    taskName.style.textDecoration = "line-through";
                                    completion.innerHTML = task.status;
                                    let timestamp = Date.now();
                                    task.finishTime = timestamp;
                                    if (Tstatus && Object.keys(Tstatus).length !== 0) {
                                        let index = Tstatus.chosen.indexOf(String(task.taskNumber));
                                        Tstatus.done[index] = String(task.taskNumber);
                                        Tstatus.time[index] = task.finishTime;
                                    }
                                } else {
                                    taskCard.style.color = 'rgb(71, 71, 71)';
                                    taskCard.style.backgroundColor = 'rgb(95, 201, 109)';
                                    taskName.style.textDecoration = "none";
                                    completion.innerHTML = task.status;
                                    task.finishTime = "";
                                    if (Tstatus && Object.keys(Tstatus).length !== 0) {
                                        let index = Tstatus.done.indexOf(String(task.taskNumber));
                                        Tstatus.done[index] = "";
                                        Tstatus.time[index] = task.finishTime;
                                    }
                                }
                                // Update task in localStorage
                                localStorage.setItem(`${preResponseId}:tasks`, JSON.stringify(tasks));
                                if (Tstatus && Object.keys(Tstatus).length !== 0) {localStorage.setItem(`${preResponseId}:fetched_tasks`, JSON.stringify(Tstatus))}
                                updateNextButton(preResponseId, userId, tasks, Tstatus);
                                console.log("time array:", Tstatus.time);
                                if (Tstatus.time.findIndex(el => el === "") === -1 && Tstatus.time.length == Tstatus.chosen.length) {
                                    let latestTimestamp = Math.max(...Tstatus.time);
                                    var separator = '@';
                                    const merged = mergeTaskArrays(tasks, separator);
                                    // Filter out tasks with finish times (those containing "@")
                                    const tasksWithFinishTimes = merged.chosen.filter(task => task.includes("@"));
                                    // Map to extract finish times and task numbers
                                    const taskDetails = tasksWithFinishTimes.map(task => {
                                        const [taskNumber, finishTime] = task.split("@");
                                        return { taskNumber: taskNumber, finishTime: Number(finishTime) };
                                    });
                                    // Sort tasks by finishTime in descending order
                                    taskDetails.sort((a, b) => b.finishTime - a.finishTime);
                                    // Get the task with the latest finish time
                                    const latestTask = taskDetails[0];
                                    const lastTask = `${latestTask.taskNumber}@${latestTask.finishTime}`;
                                    // Update response history
                                    try {
                                        await updateResponseHistory(preResponseId, lastTask);
                                        console.log(`Response history updated with task: ${lastTask}`);
                                    } catch (err) {
                                        console.error("Error updating response history:", err);
                                    }
                                }
                            })      
                        }
                        localStorage.setItem(`${preResponseId}:tasks`, JSON.stringify(tasks));
                        if (Tstatus && Object.keys(Tstatus).length !== 0) {localStorage.setItem(`${preResponseId}:fetched_tasks`, JSON.stringify(Tstatus))}
                        updateNextButton(preResponseId, userId, tasks, Tstatus); 
                    });   
                });
                
                localStorage.setItem(`${preResponseId}:tasks`, JSON.stringify(tasks));
                if (Tstatus && Object.keys(Tstatus).length !== 0) {localStorage.setItem(`${preResponseId}:fetched_tasks`, JSON.stringify(Tstatus))} 
                await updateTaskStatus(preResponseId, userId, JSON.parse(localStorage.getItem(`${preResponseId}:tasks`)));
                updateNextButton(preResponseId, userId, tasks, Tstatus);
                cardContainer.appendChild(nextButtonContainer);

                console.log("time array:", Tstatus.time);
                if (Tstatus.time.findIndex(el => el === "") === -1) {
                    let latestTimestamp = Math.max(...Tstatus.time);
                    var separator = '@';
                    const merged = mergeTaskArrays(tasks, separator);
                    // Filter out tasks with finish times (those containing "@")
                    const tasksWithFinishTimes = merged.chosen.filter(task => task.includes("@"));
                    // Map to extract finish times and task numbers
                    const taskDetails = tasksWithFinishTimes.map(task => {
                        const [taskNumber, finishTime] = task.split("@");
                        return { taskNumber, finishTime: Number(finishTime) };
                    });
                    // Sort tasks by finishTime in descending order
                    taskDetails.sort((a, b) => b.finishTime - a.finishTime);
                    // Get the task with the latest finish time
                    const latestTask = taskDetails[0];
                    const lastTask = `${latestTask.taskNumber}@${latestTask.finishTime}`;
                    // Update response history
                    try {
                        await updateResponseHistory(preResponseId, lastTask);
                        console.log(`Response history updated with task: ${lastTask}`);
                    } catch (err) {
                        console.error("Error updating response history:", err);
                    }
                }
            }
            
            document.addEventListener("DOMContentLoaded", async function() {
                
                btn_next.id = "btn_next";
                btn_next.style.pointerEvents = "none"; 
                btn_next.style.backgroundColor = "grey"; 
                btn_next.style.cursor = "not-allowed";

                try {
                    showSpinner();

                    const user = netlifyIdentity.gotrue.currentUser();
                    if (user) {
                        user.jwt().then(token => {

                                console.log("Token expired. Prompting user to re-login...");
                                netlifyIdentity.logout();
                            } else {
                                console.log("Token is valid.");
                            }

                    }
                    
                    const metadata = user.user_metadata;
