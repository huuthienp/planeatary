            </div>
            <div class="content">
                <iframe class="quiz" title="Planeatary quiz"></iframe>
                <div class="btn-next">
                    <a><button type="button" class="btn btn-success next" style="width: 150px;">Next  &#8594;</button></a>
                </div>
            </div>
        </div>
        
        <script>
        const getUserId = () => JSON.parse(localStorage['gotrue.user']).id || '';
        const getResult = () => JSON.parse(localStorage['preResult']);
          
        function updateAnchor(anchor, url=null) {
            if (url) {
                anchor.removeAttribute('disabled');
                anchor.href = url;
                anchor.style.cursor = 'pointer';
            } else {
                anchor.removeAttribute('href');
                anchor.disabled = true;
                anchor.style.cursor = 'not-allowed';
            }
        }
        const navChallenge = document.getElementById('navChallenge');
        const navDashboard = document.getElementById('navDashboard');
        const navNext = document.querySelector('div.btn-next > a');
        const nextButton = document.querySelector('div.btn-next button.next');
        
        function enableButtons() {
            nextButton.style.backgroundColor = '#02897A';
            nextButton.style.borderColor = '#02897A';
            nextButton.style.cursor = 'pointer';
            updateAnchor(navChallenge, 'manifesto_page');
            updateAnchor(navDashboard, 'result_page');
            updateAnchor(navNext, 'result_page');
        }
        function disableButtons() {
            nextButton.style.backgroundColor = 'grey';
            nextButton.style.borderColor = 'grey';
            nextButton.style.cursor = 'not-allowed';
            updateAnchor(navChallenge);
            updateAnchor(navDashboard);
            updateAnchor(navNext);
        }
        function updateIFrame(frm, src=null) {
            try {
                new URL(src);
                if (!frm.src) {  // avoid reloading
                    frm.src = src;
                }
                frm.style.display = null;
            } catch(error) {
                frm.style.display = 'none';
            }
        }
        </script>
        <script defer type="module">
        const qDataCtId = 'uow.syd1';
        const qSurveyId = 'SV_8es3au3sYKpwaii';
        const quizFrame = document.querySelector('div.content > iframe.quiz');
        try {
            const quizUrl = `https://${qDataCtId}.qualtrics.com/jfe/form/${qSurveyId}?userId=${getUserId()}`;
        } catch(error) {
            console.error(error);
            console.warn('You are not logged in!');
        }
        // Initial preResult check
        try {
            getResult();
            enableButtons();
            updateIFrame(quizFrame);  // hide
        } catch(error) {
            console.error(error);
            disableButtons();
            updateIFrame(quizFrame, quizUrl);  // show
        }
        // Listen to preResult change in localStorage
        window.onstorage = (event) => {
            if (event.key === 'preResult' && event.oldValue !== event.newValue) {
                try {
                    JSON.parse(event.newValue || '');  // force null -> empty string to throw error
                    enableButtons();
                    updateIFrame(quizFrame);  // hide
                } catch(error) {
                    console.error(error);
                    disableButtons();
                    updateIFrame(quizFrame, quizUrl);  // show
                }
            }
        };
        </script>
    </body>
