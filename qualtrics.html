        <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
        <script>

            const spinner = document.getElementById('spinner');
            const bOverlay = document.getElementById("spinnerOverlay");
            let isLoading = false;
            const minDisplayTime = 1000;
            let spinnerStartTime;
            
            function showSpinner() {
                console.log("Showing spinner...");
                spinner.classList.remove('hidden');
                bOverlay.classList.remove('hidden');
                isLoading = true;
                spinnerStartTime = Date.now();
            };

            function hideSpinner() {
                const elapsedTime = Date.now() - spinnerStartTime;
                if (elapsedTime < minDisplayTime) {
                        setTimeout(() => {
                            console.log("Hiding spinner after min time...");
                            spinner.classList.add('hidden');
                            bOverlay.classList.add('hidden');
                            isLoading = false;
                        }, minDisplayTime - elapsedTime);
                    } else {
                        spinner.classList.add('hidden');
                        bOverlay.classList.add('hidden');
                        isLoading = false;
                    }
            }

            function logOut() {
                if (netlifyIdentity.gotrue.currentUser() !== null) {
                    let user = netlifyIdentity.gotrue.currentUser();
                    user.logout().then(() => {
                        console.log('User has been logged out!');
                        window.location.href = "index.html";
                    });
                } else {
                    console.log("No user is logged in!");
                }
            }

            document.getElementById('logOut').addEventListener('click', () => {
                if(confirm("Do you really want to sign out?") == true) {
                    showSpinner();
                    logOut();
                    hideSpinner();
                }
            });
            
            const nextButton = document.getElementById('nextButt');
            // const restartBtn = document.getElementById('restartBtn');
            const quizFrame = document.querySelector('div.content > iframe.quiz');
            const quizSpan = document.querySelector('div.content > span.void');
            
            const anchors = [
                document.getElementById('navChallenge'),
                document.getElementById('navDashboard'),
                document.querySelector('div.btn-next > a'),  // inside next button
            ];
            const hrefs = [
                'manifesto_page',
                'result_page',
                'result_page',
            ];

        </script>

            import { initiateSurvey, updateAnchors, updateButton } from './scripts/helpers.mjs';
            const quizUrl = initiateSurvey('pre', quizFrame);
            var preObject = JSON.parse(localStorage.getItem('preResult'));
            var storedCycle = JSON.parse(localStorage.getItem('selectedCycle'));
            
            try {
                var allRes = await fetchResponses(userId);
                let allResponses = JSON.parse(localStorage.getItem('allResponses'));
                
                if (storedCycle) {

                        preObject = storedCycle.preResponse;

                }

                updateAnchors(anchors, hrefs);
                updateButton(nextButton, '#02897A', 'pointer');
                quizUrl.innerHTML = 'You have already finished the pre-quiz!';

            } catch(error) {
                console.warn('Caught', error, '\nPre-quiz result is not found!');

                updateButton(nextButton, 'grey', 'not-allowed');
                quizFrame.style.display = "none";
                
            }
            // Listen to preResult change in localStorage
            window.addEventListener('localStorageChange', (event) => {  // custom event by LocalStorageService in ./scripts/helpers.mjs
                const { type, detail: { key, oldValue, newValue } } = event;
                console.log(type, 'event:', key, 'changed from', oldValue, 'to', newValue);
                if (key === 'preResult' && oldValue !== newValue) {
                    try {
                        JSON.parse(newValue || undefined);  // force null -> undefined to throw error
                        updateAnchors(anchors, hrefs);
                        updateButton(nextButton, '#02897A', 'pointer');
                        quizSpan.innerText = 'Thank you for your response!';
                        console.log('Found pre-quiz result in storage!\n', newValue);
                    } catch(error) {
                        console.warn('Caught', error, '\nPre-quiz result is not found!');
                        updateAnchors(anchors);
                        updateButton(nextButton, 'grey', 'not-allowed');
                        quizFrame.style.display = "none";
                        quizSpan.innerText = '';
                    }
                }
            });
