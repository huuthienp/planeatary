<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Icon CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    
    <div class="main-container">
        <div class="spinner hidden" id="spinner"></div>
        <div class="Header">
            <!-- Sidebar -->
            <nav class="navbar navbar-dark navbar-expand-lg sticky-top" style="background-color: #02897A;">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center" href="index.html">
                        <img  src="./images/transparent_logo.png" width="40" height="auto" class="d-inline-block align-text-top"/>
                        <strong>PlanEATary</strong>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header" style="background-color: #096358;">
                            <h5 class="offcanvas-title d-flex align-items-center text-white" id="offcanvasNavbarLabel"><img  src="./images/transparent_logo.png" width="40" height="auto" class="d-inline-block align-text-top"/>planeatary</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body" style="background-color: #02897A;">
                            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                                <li class="nav-item">
                                    <a class="nav-link disabled" href="index.html" data-bs-dismiss="offcanvas"><i class="fa fa-home"></i> Home</a>
                                </li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle active" aria-current="page" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa fa-edit"></i>  <strong>Quiz</strong>
                                    </a>
                                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-lg-end" style="background-color: #25b3a2;">
                                        <li><a class="dropdown-item disabled" href="qualtrics.html" data-bs-dismiss="offcanvas">Pre-quiz</a></li>
                                        <li><a class="dropdown-item active" aria-current="page" href="qualtrics_post.html" data-bs-dismiss="offcanvas">Post-quiz</a></li>
                                    </ul>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link disabled" id="ch" href="#" data-bs-dismiss="offcanvas"><i class="fa fa-rocket"></i> Challenge</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="d" href="result_page.html" data-bs-dismiss="offcanvas"><i class="fa fa-line-chart"></i> Dashboard</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="history_page.html" data-bs-dismiss="offcanvas"><i class="fa fa-calendar-check-o"></i> History</a>
                                </li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa fa-user-circle-o"></i> User</a>
                                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-lg-end" style="background-color: #25b3a2;">
                                        <li><a class="dropdown-item" href="account manage.html" data-bs-dismiss="offcanvas">My account</a></li>
                                        <li><a class="dropdown-item" id="logOut">Log out</a></li>
                                    </ul>
                                </li>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
            <div class="content">
                <iframe class="quiz" title="PlanEATary Post-Quiz"></iframe>
                <span class="fallback"></span>
                <div class="btn-next">
                    <button id="nextButt" type="button" class="btn btn-success next" style="width: 150px;">Next  &#8594;</button>
                </div>
            </div>
            <!-- spinner overlay-->
            <section class="overlay hidden" id="spinnerOverlay"></section>
            <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
            <script>
                
                const ch = document.getElementById("ch");
                const nextButton = document.getElementById('nextButt');
                
                const spinner = document.getElementById('spinner');
                const bOverlay = document.getElementById("spinnerOverlay");
                let isLoading = false;
                const minDisplayTime = 1000;
                let spinnerStartTime;
                
                function showSpinner() {
                    console.log("Showing spinner...");
                    spinner.classList.remove('hidden');
                    bOverlay.classList.remove('hidden');
                    isLoading = true;
                    spinnerStartTime = Date.now();
                };
                
                function hideSpinner() {
                    const elapsedTime = Date.now() - spinnerStartTime;
                    if (elapsedTime < minDisplayTime) {
                        setTimeout(() => {
                            console.log("Hiding spinner after min time...");
                            spinner.classList.add('hidden');
                            bOverlay.classList.add('hidden');
                            isLoading = false;
                        }, minDisplayTime - elapsedTime);
                    } else {
                        spinner.classList.add('hidden');
                        bOverlay.classList.add('hidden');
                        isLoading = false;
                    }
                }
                
                //hard-code updating responseHistory
                async function updateResponseHistory(postObject, user) {
                    if (!user) {
                        console.error("No user is logged in!");
                        return;
                    }
                    
                    const userId = user.id;
                    
                    const postResponseId = postObject?.responseId;
                    if (!postResponseId) {
                        console.error("No postResponseId provided!");
                        return;
                    }
                    
                    let responseHistory = user?.user_metadata?.responseHistory ?? [];
                    const index = responseHistory.findIndex(cycle => cycle.postId === postResponseId);
                    const mockResponseHistory = JSON.parse(localStorage.getItem(`${userId}:ResponseHistory`) || "{}");

                    // If the postResponseId is not already in the history, add it
                    if (index === -1) {
                        responseHistory.push({ postId: postResponseId });
                        console.log("The post-quiz updated",  responseHistory)
                        Object.assign(mockResponseHistory?.user_metadata?.responseHistory[0], { postId: postResponseId });
                        user.update({
                            user_metadata: { responseHistory: responseHistory,},
                        }).then((updatedUser) => {
                            console.log("User metadata updated:", updatedUser);
                            // Fetch the latest user object instead of using reload()
                            netlifyIdentity.gotrue.currentUser()
                            .jwt()
                            .then((token) => {
                                const updatedUserDetails = netlifyIdentity.gotrue.currentUser();
                                localStorage.setItem("gotrue.user", JSON.stringify(updatedUserDetails));
                                console.log("Updated user saved to localStorage:", updatedUserDetails);
                            })
                            .catch((error) => {
                                console.error("Error fetching updated user details:", error);
                            });
                        }).catch((error) => {
                            console.error("Error updating user metadata:", error);
                        });
                        
                    } else {
                        console.log("Post response ID already exists in response history.");
                    }
                    localStorage.setItem(`${userId}:ResponseHistory`, JSON.stringify(mockResponseHistory));
                }

                function logOut() {
                    const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                    
                    if (netlifyIdentity.gotrue.currentUser() !== null) {
                        let user = netlifyIdentity.gotrue.currentUser();
                        user.logout().then(() => {
                            offcanvas.hide();
                            console.log('User has been logged out!');
                            window.location.href = "index.html";
                        });
                    } else {
                        window.location.href = "index.html";
                        console.log("No user is logged in!");
                    }
                }
                
                document.getElementById('logOut').addEventListener('click', () => {
                    if(confirm("Do you really want to sign out?") == true) {
                        showSpinner();
                        logOut();
                        hideSpinner();
                    }
                });
                
            </script>      
            <script defer type="module">
                import { initiateSurvey, fetchTaskStatus, extractTaskData, updateButton } from './scripts/helpers.mjs';

                async function fetchResponses(userId) {
                    try {
                        const response = await fetch('/api/fetch-responses', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Q-RESPONSE-ID': userId,
                            }
                        });
                        const { ok, status } = response;
                        if (!ok) {
                            throw new Error(JSON.stringify({
                                status: status,  
                                response: await response.text(),
                            }));
                        }
                        const data = await response.json();
                        console.log('Responses fetched!\n', data);
                        localStorage.setItem(`${userId}:allResponses`, JSON.stringify(data));
                        return JSON.parse(data);
                        
                    } catch (error) {
                        console.warn('Caught', error, '\nin fetchResponse');
                        return null;
                    }
                }

                function isTokenExpired(token) {
                    if (!token) return true;
                    
                    const base64Payload = token.split('.')[1]; 
                    const decodedPayload = JSON.parse(atob(base64Payload));
                    const exp = decodedPayload.exp; 
                    
                    // Compare current time with expiration time
                    const now = Math.floor(Date.now()/1000); 
                    return exp < now; // Returns true if token is expired
                }

                function checkLastTaskStatus(metadata) {
                        var responseHistory = metadata?.responseHistory ?? null;
                        //handle first-time user
                        if (!metadata || !responseHistory) {
                            console.warn("No responseHistory found for this user.");
                            return { quizObj: { lastPre: "", lastPost: "" }, historyObj: [] };
                        } else {
                            const cycleKeys = Object.keys(responseHistory || {});
                            if (cycleKeys.length > 0) {
                                const latestCycleKey = cycleKeys[cycleKeys.length - 1];  // Get the last cycle
                                const entry = responseHistory[latestCycleKey];
                                latest_pre = entry.preId || "";
                                latest_post = entry.postId || "";
                                latest_task = entry.lastTask || "";
                            }
                        }

                        const cycle = {lastPre: latest_pre, lastPost: latest_post, lastTask: latest_task};
                        return cycle
                    }

                
                document.addEventListener("DOMContentLoaded", async () => {

                    updateButton(nextButton, 'grey', 'not-allowed');

                    var preObject = JSON.parse(localStorage.getItem('preResult'));
                    var preResult = preObject?.result;
                    var preResponseId = preObject?.responseId;
                    var postObject = JSON.parse(localStorage.getItem('postResult'));
                    var postResult = postObject?.result ?? null;
                    var post_rec = postObject?.recordedDate ?? null;

                    var tasks = JSON.parse(localStorage.getItem(`${preResponseId}:tasks`));
                    var selectTasks = JSON.parse(localStorage.getItem(`${preResponseId}:fetched_tasks`));

                    const quizFrame = document.querySelector('div.content > iframe.quiz');

                    let latest_pre = "";
                    let latest_post = "";
                    let latest_task = "";

                    const fallbackMessage = document.querySelector(".fallback");
                    fallbackMessage.classList.add("empty-state");

                    const offcanvasNavbar = document.getElementById('offcanvasNavbar');
                    const offcanvasLinks = document.querySelectorAll('#offcanvasNavbar .nav-link');
                    const offcanvasDropdown = document.querySelectorAll('#offcanvasNavbar .dropdown-item');

                    const netlifyIdentity = window.netlifyIdentity;
                    const user = netlifyIdentity.gotrue.currentUser();

                    if (user) {
                        user.jwt().then(token => {
                            if (isTokenExpired(token)) {
                                console.log("Token expired. Prompting user to re-login...");
                                netlifyIdentity.logout();
                                window.location.href = "index.html";
                            } else {
                                console.log("Token is valid.");
                            }
                        });
                    }

                    const metadata = user.user_metadata;
                    const responseHistory = metadata.responseHistory;
                    const userId = user.id;

                    offcanvasLinks.forEach(li => {
                        li.addEventListener('click', event => {
                            const targetHref = li.getAttribute('href');
                            
                            const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                            offcanvas.hide();
                            
                            if (targetHref && targetHref !== '#') {
                                window.location.href = targetHref; 
                            }
                        });
                    });
                    
                    offcanvasDropdown.forEach(li => {
                        li.addEventListener('click', event => {
                            const targetHref = li.getAttribute('href');
                            const offcanvas = new bootstrap.Offcanvas(offcanvasNavbar);
                            offcanvas.hide();
                            
                            if (targetHref) {
                                window.location.href = targetHref; 
                            }
                        });
                    });

                    nextButton.addEventListener('click', () => {
                        if (nextButton.style.cursor !== "not-allowed") { window.location.href = "result_page.html"; }
                    });

                    // Set up an interval to check for changes in localStorage
                    //setInterval(updateButton, 1000);
                    
                    //clear any existing message
                    fallbackMessage.innerHTML = "";

                    try { 
                        showSpinner();
                        //handle a user directly from the history page
                        var storedCycle = JSON.parse(sessionStorage.getItem('selectedCycle'));
                        var allRes = await fetchResponses(userId);
                        var allResponses = JSON.parse(localStorage.getItem(`${userId}:allResponses`));
                        let postQuiz = null;
                        let preQuiz = null;

                        if (storedCycle) {
                            try {
                                
                                preObject = storedCycle?.preResponse ?? null;
                                preResult = preObject?.result ?? null;
                                preResponseId =preObject?.responseId ?? null;
                                
                                postObject = storedCycle?.postResponse ?? null;
                                postResult = postObject?.result ?? null;
                                postResponseId = postObject?.responseId ?? null;
                                
                            } catch(err) {
                                console.log("Couldn't find previous info from history:", err);
                            }
                        } else if (allResponses) {
                                const cycleKeys = allResponses || []; 
                                if (cycleKeys.length > 0) {
                                    const lastKey = cycleKeys[cycleKeys.length - 1]; 
                                    const entry = allResponses?.[lastKey] ?? {}; 
                                    
                                    // Access preQuiz and postQuiz safely
                                    preQuiz = entry?.preResponse ?? null;
                                    postQuiz = entry?.postResponse ?? null;
                                    postObject = postQuiz;
                                    preObject = preQuiz;
                                    preResponseId = preQuiz?.responseId ?? null;
                                    
                                    console.log('Last entry:', entry);
                                }
                            } else {
                                var allRes = await fetchResponses(userId);
                                allResponses = JSON.parse(localStorage.getItem(`${userId}:allResponses`));
                                const cycleKeys = allResponses || []; 
                                if (cycleKeys.length > 0) {
                                    const lastKey = cycleKeys[cycleKeys.length - 1]; 
                                    const entry = allResponses?.[lastKey] ?? {}; 
                                    
                                    // Access preQuiz and postQuiz safely
                                    preQuiz = entry?.preResponse ?? null;
                                    postQuiz = entry?.postResponse ?? null;
                                    postObject = postQuiz;
                                    preObject = preQuiz;
                                    preResponseId = preQuiz?.responseId ?? null;
                                    
                                    console.log('Last entry:', entry);
                                }
                            }
                            
                            if(preObject) {
                                var preResult = preObject?.result ?? null;
                                var pre_rec = preObject?.recordedDate ?? null;
                                var preResponseId = preObject?.responseId ?? null;
                                if (postObject) {
                                    postResult = postObject?.result ?? null;
                                    post_rec = postObject?.recordedDate ?? null;
                                    await updateResponseHistory(postObject, user);
                                    updateButton(nextButton, '#02897A', 'pointer');
                                    quizFrame.style.display = 'none'; 
                                    fallbackMessage.innerHTML = "<div class='void'>Excellent! You have finished everything in the cycle! Please go back to the home page or pre-quiz if wish to start over. Or click next to see the result!</div>";
                                } else if (!postObject || Object.keys(postObject).length === 0) {
                                    try {
                                        if (!selectTasks) {
                                            selectTasks = await fetchTaskStatus(preResponseId, userId);
                                            localStorage.setItem(`${preResponseId}:fetched_tasks`, JSON.stringify(selectTasks));
                                            selectTasks = JSON.parse(localStorage.getItem(`${preResponseId}:fetched_tasks`));
                                        } else {
                                            var firstNullIndex = selectTasks?.time?.length !== 0 ? selectTasks?.time?.findIndex(el => el == "") : 0;
                                            if (firstNullIndex !== -1) {
                                                alert("Please finish all the chosen tasks before doing post-quiz.");
                                                quizFrame.style.display = 'none'; 
                                                document.querySelector('.btn-next').style.display = 'none';
                                                fallbackMessage.innerHTML = "<div class='empty-state'>Please finish all selected tasks before doing the post quiz.</div>";
                                                window.location.href = "challenge_page.html";
                                                return;
                                            } else {
                                                var quizUrl = initiateSurvey('post', quizFrame);
                                            }
                                        }
                                    } catch(err) {
                                        console.log("Caugt error: ", err)
                                        quizFrame.style.display = 'none'; 
                                        document.querySelector('.btn-next').style.display = 'none';
                                        fallbackMessage.style.color = "#ff6b6b";
                                        fallbackMessage.innerHTML = err;
                                        window.location.href = "challenge_page.html";
                                        return;
                                    }  
                                } 
                            } else {
                                //unsure about this logic
                                var quizUrl = initiateSurvey('post', quizFrame);
                            } 
                        } catch (err) {
                            console.error("Caught error: ", err);
                            quizFrame.style.display = 'none';
                            document.querySelector('.btn-next').style.display = 'none';
                            fallbackMessage.innerHTML = "Content cannot be displayed. Please try again later.";
                            nextButton.style.display = "none";
                    } finally {
                        await updateResponseHistory(postObject, user);
                        hideSpinner();
                    } 
                });

                // Listen to postResult change in localStorage
                window.addEventListener('localStorageChange', async (event) => {  // custom event by LocalStorageService in ./scripts/helpers.mjs
            
                    const quizFrame = document.querySelector('div.content > iframe.quiz');
                    const fallbackMessage = document.querySelector(".fallback");
                    fallbackMessage.classList.add("empty-state");
                    
                    const { type, detail: { key, oldValue, newValue } } = event;
                    console.log(type, 'event:', key, 'changed from', oldValue, 'to', newValue);
                    if (key === 'postResult' && oldValue !== newValue) {
                        try {
                            JSON.parse(newValue || undefined);  // force null -> undefined to throw error
                            quizFrame.style.display = 'none';
                            fallbackMessage.innerHTML = '<div class="void">Thank you for your response!</div>';
                            updateButton(nextButton, '#02897A', 'pointer');
                            console.log('Found post-quiz result in storage!\n', newValue);
                        } catch(error) {
                            console.warn('Caught', error, '\nPost-quiz result is not found!');
                            updateButton(nextButton, 'grey', 'not-allowed');
                            var quizUrl = initiateSurvey('post', quizFrame);
                            // quizSpan.innerText = 'An error occurred. Please try again later.';
                        }
                    }
                });

            </script>
            <!-- Bootstrap Javascript -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script defer type="module" src="./scripts/listen-to-qualtrics.mjs"></script>
        </body>
