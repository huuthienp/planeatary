    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module">
        import { fetchTaskStatus, extractTaskData, updateTaskStatus, mergeTaskArrays } from './scripts/helpers.mjs';
        
        const QContainer = document.querySelector(".q-task");
        
        const good = document.getElementById("good");
        const bad = document.getElementById("notyet");
        const spOver = document.getElementById("spinnerOverlay");
        
        
        good.style.backgroundColor = '#a9d1cd';
        bad.style.backgroundColor = '#02897A';

        const spinner = document.getElementById('spinner');
        let isLoading = false;
        const minDisplayTime = 2000; 
        let spinnerStartTime;

        function showSpinner() {
            spinner.classList.remove('hidden');
            spOver.classList.remove('hidden');
            isLoading = true;
            spinnerStartTime = Date.now();
        };

        function hideSpinner() {
            const elapsedTime = Date.now() - spinnerStartTime;
            
            if (elapsedTime < minDisplayTime) {
                setTimeout(() => {
                    spinner.classList.add('hidden');
                    spOver.classList.add('hidden');
                    isLoading = false;
                }, minDisplayTime - elapsedTime);
            } else {
                spinner.classList.add('hidden');
                spOver.classList.add('hidden');
                isLoading = false;
            }
        }

        function logOut() {
            if (netlifyIdentity.gotrue.currentUser() !== null) {
                let user = netlifyIdentity.gotrue.currentUser();
                user.logout().then(() => {
                    console.log('User has been logged out!');
                    window.location.href = "index.html";
                });
            } else {
                console.log("No user is logged in!");
            }
        }

        document.getElementById('logOut').addEventListener('click', () => {
            if(confirm("Do you really want to sign out?") == true) {
                showSpinner();
                logOut();
                hideSpinner();
            }
        });
        
        document.addEventListener("DOMContentLoaded", async function() {
            const startButton = document.querySelector(".start");
            
            const modal = document.querySelector(".modal");
            const overlay = document.querySelector(".overlay");
            const modal2 = document.querySelector(".modal2");
            const overlay2 = document.querySelector(".overlay2");
            const modalTitle = document.getElementById("modalTitle");
            const closeButt = document.querySelector('.close');
            const close = document.getElementById('close');
            const closeDes = document.getElementById('closeDes');

            const spinner = document.getElementById('spinner');
            let isLoading = false;
            const minDisplayTime = 2000; 
            let spinnerStartTime;
            
            
            let scores = [];
            
            
            let task_counts = 0;
            let tasks = JSON.parse(localStorage.getItem('tasks')); 
            let fetched_tasks = JSON.parse(localStorage.getItem('fetched_tasks'));

            function isTokenExpired(token) {
                if (!token) return true;
                
                const base64Payload = token.split('.')[1]; 
                const decodedPayload = JSON.parse(atob(base64Payload));
                const exp = decodedPayload.exp; 
                
                // Compare current time with expiration time
                const now = Math.floor(Date.now()/1000); 
                return exp < now; // Returns true if token is expired
            }
            
            const user = netlifyIdentity.gotrue.currentUser();
            
            if (user) {
                user.jwt().then(token => {
                    if (isTokenExpired(token)) {
                        console.log("Token expired. Prompting user to re-login...");
                        netlifyIdentity.logout();
                        window.location.href = "index.html";
                    } else {
                        console.log("Token is valid.");
                    }
                });
            }
            
            const metadata = user.user_metadata;
            const responseHistory = metadata.responseHistory;
            const userId = user.id;

            var preResult = JSON.parse(localStorage.getItem('preResult'));
            var preResponseId; 

            //handle first-time user
            if (!metadata || !metadata.responseHistory) {
                console.warn("No responseHistory found for this user.");
                document.querySelector(".button2").style.display = "none";
                document.querySelector(".improvement").style.display = "none";
                const fallbackMessage = document.createElement('div');
                fallbackMessage.innerHTML = "Opp! No information available";
                document.querySelector(".task-content").parentElement.appendChild(fallbackMessage);
            }

            try {
                showSpinner();
                //from history page
                var storedCycle = JSON.parse(localStorage.getItem('selectedCycle'));
                preResponseId =  preResult.responseId;
                
                if (!preResult || !preResponseId) {
                    alert("No pre quiz found. Please do the quiz first.");
                    window.location.href = "index.html";
                    return;
                }
                
                if (storedCycle) {
                    
                    preObject = storedCycle.preResponse;
                    preResult = preObject.result;
                    pre_rec = preObject.recordedDate;
                    preResponseId = preObject.responseId;
                    
                    postObject = storedCycle.postResponse;
                    postResult = postObject.result;
                    post_rec = postObject.recordedDate;
                    
                    try {
                        var selectTasks = await fetchTaskStatus(preResponseId);
                        localStorage.setItem('fetched_tasks', JSON.stringify(selectTasks));
                        fetched_tasks = selectTasks; 
                        task_rec = fetched_tasks.time; 
                    } catch(err) {
                        console.log("Couldn't find previous tasks' info:", err);
                    }
                }
                
                if (!tasks) {
                    tasks = await fetchTasks();  
                    localStorage.setItem('tasks', JSON.stringify(tasks));
                    tasks = JSON.parse(localStorage.getItem('tasks'));
                }
                
                if (!fetched_tasks && preResponseId) {
                    try {
                        fetched_tasks = await fetchTaskStatus(preResponseId);
                        localStorage.setItem('fetched_tasks', JSON.stringify(fetched_tasks));
                        fetched_tasks = JSON.parse(localStorage.getItem('fetched_tasks'));
                        task_rec = fetched_tasks.time; 
                    } catch (err) {
                        console.error("Couldn't find previous tasks' info:", err);
                    }
                }
                
            } catch (err) {
                console.error("Caught error: ", err);
            } finally {
                hideSpinner();
            }
            
            function Modal(source) {
                close.classList.remove('hidden');
                const modalContent = document.querySelector(".modal_content");
                const image = document.getElementById("visual_info");
                image.src = source;
                modal.classList.remove('hidden');
                overlay.classList.remove('hidden');
            };
            
            function ModalDes(title, des) {
                closeDes.classList.remove('hidden2');
                const modalContent = document.querySelector(".modal-content");
                const text = document.getElementById("inform");
                modalTitle.textContent = title;
                const taskDescription = des.replace('target="_blank"', 'rel="noopener noreferrer"');
                text.innerHTML = taskDescription;
                modal2.classList.remove('hidden2');
                overlay2.classList.remove('hidden2');
                
            };
            
            function Close() {
                close.classList.add('hidden');
                modal.classList.add("hidden");
                overlay.classList.add('hidden');
                
            };
            
            function CloseDes() {
                closeDes.classList.add('hidden2');
                modal2.classList.add("hidden2");
                overlay2.classList.add('hidden2');
            };
            
            
            document.getElementById("close").addEventListener("click", Close);
            document.getElementById("closeDes").addEventListener("click", CloseDes);
            
            // Close modal when user clicks outside the modal
            window.addEventListener("click", function(event) {
                if (event.target === modalOverlay) {
                    close();
                    CloseDes();
                }
            });
            
            
            // Retrieve tasks from localStorage or fetch if not available
            async function fetchTasks() {
                const taskData = localStorage.getItem('tasks');
                if (!taskData) {
                    try {
                        const response = await fetch('updated_tasks_final.json');
                        if (!response.ok) {
                            throw new Error('Network response was not ok ' + response.statusText);
                        }
                        const data = await response.json();
                        return data;
                    } catch (error) {
                        console.error('Fetch error:', error);
                        alert('Failed to load tasks. Please try again later.');
                        return null;
                    };
                    
                }
                return JSON.parse(taskData);
            }
            
            function calculateSelectedTasks(tasks) {
                let count = 0;
                Object.keys(tasks).forEach((questionKey) => {
                    const taskGroup = tasks[questionKey].tasks;
                    taskGroup.forEach(task => {
                        if (task.choice === 'chosen') {
                            count += 1;
                        }
                    });
                });
                return count;
            }
            
            async function renderQuestions(condition) {
                QContainer.innerHTML = '';
                
                if(!preResult && !preResponseId) {
                    QContainer.innerHTML = '<p>No available information to be displayed</p>';
                } else {
                    let preTotalScore = preResult.result.totalScore; 
                    scores = preResult.result.pointArray;
                }

                if (!tasks) {
                    tasks = await fetchTasks();
                    localStorage.setItem('tasks', JSON.stringify(tasks));
                    tasks = JSON.parse(localStorage.getItem('tasks'));
                }
                
                if (!fetched_tasks) {
                    try {
                        await updateTaskStatus(preResponseId, JSON.parse(localStorage.getItem('tasks')));
                        fetched_tasks = await fetchTaskStatus(preResponseId); 
                        localStorage.setItem('fetched_tasks', JSON.stringify(fetched_tasks));
                        fetched_tasks = JSON.parse(localStorage.getItem('fetched_tasks'));
                    } catch(err) {
                        console.log("Couldn't find previous tasks' info:", err);
                    }
                    
                } else {
                    if (!fetched_tasks.done || !fetched_tasks.chosen) {
                        try {
                            fetched_tasks = await fetchTaskStatus(preResponseId); 
                            localStorage.setItem('fetched_tasks', JSON.stringify(fetched_tasks));
                            fetched_tasks = JSON.parse(localStorage.getItem('fetched_tasks'));
                        } catch(err) {
                            console.log("Couldn't find previous tasks' info:", err);
                        }
                    }
                }
                
                if (!tasks || !preResult) {
                    QContainer.innerHTML = "<p>Error: Unable to load tasks or scores.</p>";
                    return;
                }
                // Iterate over each question
                Object.keys(tasks).forEach((questionKey, i) => {
                    const taskGroup = tasks[questionKey].tasks;
                    const score = scores[i]; 
                    if (condition(score)) {
                        // Create a container for the question
                        const questionDiv = document.createElement('div');
                        questionDiv.classList.add('question-block');
                        
                        // Display question number and score
                        const questionTitle = document.createElement('h3');
                        questionTitle.innerHTML = `Question ${i + 1} - ${score} points `;
                        
                        if (score < 3) {
                            questionDiv.style.borderRadius = "20px";
                            questionDiv.style.boxShadow = "10px 10px 10px rgb(178, 34, 34)";
                            questionTitle.style.color = '#B22222';
                        } else {
                            questionDiv.style.borderRadius = "20px";
                            questionDiv.style.boxShadow = "10px 10px 10px rgb(46, 139, 87)";
                            questionTitle.style.color = '#2E8B57';
                        }
                        
                        // Add the info icon with a click event to open the modal
                        const infoIcon = document.createElement('img');
                        infoIcon.src = './images/info.png';
                        infoIcon.width = '20';
                        infoIcon.style.cursor = 'pointer'; 
                        
                        questionTitle.appendChild(infoIcon); 
                        questionDiv.appendChild(questionTitle);
                        
                        // Set the click event for the info icon to show the modal with the correct image
                        infoIcon.addEventListener('click', function() {
                            Modal(`./images/pop${i + 1}.jpg`); 
                        });
                        
                        // Create a list to hold the tasks for this question
                        const taskList = document.createElement('ul');
                        
                        // Iterate over tasks for the question
                        taskGroup.forEach((task, j) => {
                            const taskItem = document.createElement('li');
                            const label = document.createElement('label');
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            
                            // Add an info icon for task description
                            const infoIcon2 = document.createElement("span");
                            infoIcon2.classList.add("info-icon");
                            infoIcon2.innerHTML = "&#9432;"; 

                            label.classList.add('task-label');
                            
                            label.appendChild(checkbox);
                            label.appendChild(document.createTextNode(task.taskName));
                            label.appendChild(infoIcon2);
                            taskItem.appendChild(label);
                            taskList.appendChild(taskItem);
                            
                            // Set task choice and status based on local storage and finish time
                            if (fetched_tasks) {
                                if (fetched_tasks.chosen && fetched_tasks.done) {
                                    if (fetched_tasks.chosen.includes(String(task.taskNumber))) {
                                        task.choice = 'chosen';
                                        checkbox.checked = true;
                                        // for incomplete task, finish time is empty string ''
                                        const _index = fetched_tasks.chosen.indexOf(task.taskNumber);
                                        // `chosen` and `time` are parallel
                                        task.finishTime = fetched_tasks.time[_index];
                                        if (fetched_tasks.done.includes(String(task.taskNumber))) {
                                            task.status = 'Completed';
                                            checkbox.disabled = true; // Disable the checkbox if the task is completed
                                        }
                                    }
                                }
                                //Also double-check task status in local storage
                                checkbox.disabled = task.status === 'Completed';
                                localStorage.setItem('fetched_tasks', JSON.stringify(fetched_tasks)); 
                            }
                            
                            checkbox.disabled = task.status === 'Completed';
                            
                            // Update task count and localStorage on checkbox change
                            checkbox.addEventListener('change', function() {
                                if (!checkbox.disabled) {
                                    if (checkbox.checked) {
                                        task.choice = "chosen";
                                        task_counts += 1;
                                    } else {
                                        task.choice = "";                                         
                                        task_counts -= 1;
                                    }
                                    localStorage.setItem('tasks', JSON.stringify(tasks)); 
                                    updateStartButton(); 
                                }
                            });

                            label.addEventListener('click', (e) => {
                                // If the input is disabled, show toast
                                if (checkbox.disabled) {
                                    const toasty = document.getElementById('task-toast');
                                    const myToast = new bootstrap.Toast(toasty);
                                    myToast.show();
                                }
                            });
                            
                            // Event listener for more info
                            infoIcon2.addEventListener('click', function(event) {
                                event.preventDefault();
                                event.stopPropagation(); 
                                ModalDes(task.taskName, task.taskDescription);
                            });
                            
                            checkbox.checked = task.choice === "chosen";
                            localStorage.setItem('tasks', JSON.stringify(tasks)); 
                            
                            
                            updateStartButton(); 
                        });
                        
                        questionDiv.appendChild(taskList);
                        QContainer.appendChild(questionDiv);
                        localStorage.setItem('tasks', JSON.stringify(tasks)); 
                    }
                    localStorage.setItem('tasks', JSON.stringify(tasks)); 
                    
                });
                
                task_counts = calculateSelectedTasks(tasks);
                updateStartButton(); 
            }
            
            
            // Function to update the start button state based on selected tasks
            function updateStartButton() {
                const startButton = document.querySelector(".start");
                const persuade = document.getElementById("threetask");

                if (task_counts >= 3) {
                    persuade.innerHTML = 'You’ve selected at least 3 tasks. Start challenge now';
                    persuade.style.color = 'black';
                    startButton.style.pointerEvents = "auto";
                    startButton.style.backgroundColor = "#02897A";
                } else {
                    persuade.innerHTML = `Number of selected tasks: ${task_counts}`;
                    persuade.style.color = 'grey';
                    startButton.style.pointerEvents = "none";
                    startButton.style.backgroundColor = "grey";
                }
            }
            renderQuestions((score) => score < 3);

            // Attach single click listener for the start button navigation
            // update task status on `startButton` click
            startButton.addEventListener('click', async function(event) {
                showSpinner();
                await updateTaskStatus(preResponseId, JSON.parse(localStorage.getItem('tasks')));
                hideSpinner();
                if (task_counts >= 3) {
                    window.location.href = "challenge_page.html";
                }
            });
            
            // Event listener for "good" button
            document.getElementById('good').addEventListener('click', function() {
                updateStartButton();
                var condition = (score) => score >= 3;
                renderQuestions(condition);
                var tContent = document.querySelector(".task-content");
                if (tContent.innerHTML == '') {
                    tContent.innerHTML == '<p>None of your answer got good score</p>';
                }
                good.style.backgroundColor = '#02897A';
                bad.style.backgroundColor = '#a9d1cd';
            });
            
            // Event listener for "bad" button
            document.getElementById('notyet').addEventListener('click', function() {
                updateStartButton();
                var condition = (score) => score < 3;
                renderQuestions(condition);
                var tContent = document.querySelector(".task-content");
                if (tContent.innerHTML == '') {
                    tContent.innerHTML == '<p>None of your answer got bad score</p>';
                }
                good.style.backgroundColor = '#a9d1cd';
                bad.style.backgroundColor = '#02897A';
            });
            
            
        });
    </script>
